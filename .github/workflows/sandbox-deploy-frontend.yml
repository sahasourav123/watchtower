name: sandbox-deploy-frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:

  build:
    runs-on: self-hosted
    environment:
      name: sandbox
      url: https://watchtower.finanssure.com

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Push Environment variables
      run: |
        rm .env
        echo "${{ secrets.ENV_FILE }}" > .env

    - name: Build Service
      run: docker compose build frontend

    - name: Start Service
      run: AUTH_ENABLED=true docker compose -p project-watchtower up -d frontend

    - name: Push Deploy Event
      run: curl "https://watchtower.finanssure.com/api/public/v1/push/event?monitor_id=${{ secrets.WT_MONITOR_ID }}&monitor_hash=${{ secrets.WT_MONITOR_HASH }}&outcome=true"

